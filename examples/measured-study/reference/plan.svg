    <path d="M272.5 150a105 105 0 0 1-105 105" fill="none" stroke="#73816b" stroke-width="1.5" stroke-dasharray="5 4"/><text x="215" y="136" class="small" text-anchor="middle">门 0.84</text>
    <path d="M298.75 150h175" stroke="#39828c" stroke-width="9"/><path d="M155 200v175" stroke="#c76c37" stroke-width="9"/>
