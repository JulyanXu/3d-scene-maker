<svg xmlns="http://www.w3.org/2000/svg" width="980" height="770" viewBox="0 0 980 770" role="img" aria-labelledby="title desc">
  <title id="title">午后书房 · 测绘平面</title>
  <desc id="desc">室内净宽 4.80 米、进深 3.60 米。入口在北墙西端，书桌距北墙0.20米，使用者朝北。蓝线是北墙原窗，橙线为改后西窗。每个小格代表 0.20 米。</desc>
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse" x="155" y="150"><path d="M25 0H0V25" fill="none" stroke="#e1d9c9" stroke-width=".8"/></pattern>
    <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#2d3938}.small{font-size:15px}.label{font-size:17px;font-weight:600}.metric{font-size:17px;letter-spacing:1px}.dim{fill:none;stroke:#52605a;stroke-width:1.3}.body{font-size:17px}.foot{font-size:15px;fill:#5f6860}</style>
  </defs>
  <rect width="980" height="770" fill="#f8f4e9"/>
  <text x="60" y="59" font-size="32" font-weight="650">午后书房</text><text x="246" y="57" font-size="19">家具定位与窗位变更</text>
  <text x="60" y="93" class="foot">原创合成测绘参考 · 室内中心为原点 · 单位 m</text>
