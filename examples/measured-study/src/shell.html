<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3D 场景</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#171814;color:#f8f5ec;font:14px/1.4 "Microsoft YaHei UI",system-ui,sans-serif}
    canvas{display:block;width:100%;height:100%;touch-action:none}header{position:fixed;top:0;left:0;padding:clamp(18px,3vw,46px);pointer-events:none;text-shadow:0 1px 5px #13130fde,0 2px 24px #111a}
    h1{font-family:"Noto Serif SC","Songti SC",SimSun,Georgia,serif;font-weight:500;font-size:clamp(24px,3.3vw,47px);letter-spacing:.1em;margin:0}
    header p{font-size:13px;letter-spacing:.05em;margin:7px 0 0;color:#fff8e8;max-width:min(36em,84vw)}
    #toolbar{position:fixed;bottom:clamp(14px,3vw,34px);left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;padding:7px;max-width:94vw;width:max-content;border-radius:13px;background:#202420e6;border:1px solid #ffeecb35;box-shadow:0 4px 22px #0c100f40;backdrop-filter:blur(12px)}
    button,select,.slider{font:inherit;color:#fff9ea;background:#ffffff0d;border:1px solid #fff2;border-radius:7px;padding:6px 10px;white-space:nowrap}button,select{cursor:pointer}button:hover,select:hover{background:#56554a}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #ebc892}
    option{background:#35362f;color:#fff}.slider{display:flex;gap:7px;align-items:center}.slider input{width:clamp(60px,8vw,120px);accent-color:#e0bd82}
    #error{background:#181b17;padding:1em 1.25em;border-radius:6px;position:fixed;top:42%;left:10%;right:10%;text-align:center}#error:empty,header p:empty{display:none}
    details{position:fixed;right:14px;top:14px;font-size:12px;color:#fff8e8}summary{cursor:pointer;background:#202420b8;border-radius:6px;padding:5px 8px;width:max-content;margin-left:auto}details pre{white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;max-height:68vh;width:min(510px,88vw);margin:5px 0;padding:16px;background:#222821f5;border-radius:8px;font:13px/1.6 system-ui}
  </style>
</head>
<body>
  <canvas aria-label="三维场景" tabindex="0"></canvas>
  <header><h1></h1><p></p></header>
  <nav id="toolbar" aria-label="场景操作"><select id="views" aria-label="视角"></select><button id="reset" type="button" title="返回开场镜头">复位</button></nav>
  <div id="error" role="alert"></div>
  <details><summary>素材署名</summary><pre><!-- CREDITS --></pre></details>
  <!-- SCENE_BUNDLE -->
</body>
</html>
